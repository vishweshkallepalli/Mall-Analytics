<!DOCTYPE html>
<html>

<head>

    <title>Mall Analytics</title>

    <style>

        body{
            font-family: Arial;
            text-align:center;
            background:#f2f2f2;
        }

        .box{
            background:white;
            padding:20px;
            margin:20px auto;
            width:400px;
            border-radius:10px;
        }

    </style>

</head>

<body>

    <h1>Mall Analytics Dashboard</h1>

    <div class="box">

        <h2>Total People : {{ total }}</h2>

        <h3>Males : {{ male }}</h3>

        <h3>Females : {{ female }}</h3>

        <h3>Children : {{ children }}</h3>

    </div>

    <div class="box">

        <h2>Brand Analysis</h2>

        <img src="{{ url_for('static',
                             filename='chart.png') }}"
             width="400">

    </div>

</body>

</html>
